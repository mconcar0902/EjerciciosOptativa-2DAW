<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow-sm">
					<div class="card-header">
						<h2 id="titulo" class="mb-0">Nuevo libro</h2>
					</div>
					<div class="card-body">
						<form id="formLibro">
							<div id="campoId" class="mb-3 d-none">
								<label for="id" class="form-label"> ID </label>
								<input type="text" id="id" class="form-control" readonly>
							</div>
							<div class="mb-3">
								<label for="nombre" class="form-label"> Nombre </label>
								<input type="text" id="nombre" name="nombre" class="form-control" required>
							</div>
							<div class="mb-3">
								<label for="anoEdicion" class="form-label"> Año Edicion </label>
								<input type="number" id="anoEdicion" name="anoEdicion" class="form-control" min="0" step="1" required>
							</div>
							<div class="d-flex justify-content-between">
								<a href="libros.html" class="btn btn-secondary"> Volver </a>
								<button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
							</div>
						</form>
						<div id="mensaje" class="alert mt-3 d-none"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
const URL_LIBROS = "ej01_libros";
console.log("libro.html v3 cargado");

function textoDe(padre, selector, defecto = "") {
    const el = padre ? padre.querySelector(selector) : null;
    return el ? el.textContent : defecto;
}

const parametrosUrl = new URLSearchParams(window.location.search);
const idLibro = parametrosUrl.get("id");

if (idLibro !== null) {
    prepararEdicion(idLibro);
}

async function prepararEdicion(id) {
    document.getElementById("titulo").textContent = "Editar libro";
    document.getElementById("campoId").classList.remove("d-none");
    document.getElementById("id").value = id;

    try {
        const respuesta = await fetch(`${URL_LIBROS}?id=${encodeURIComponent(id)}`);
        const xml = await respuesta.text();

        const documento = new DOMParser().parseFromString(xml, "application/xml");

        if (!respuesta.ok) {
            const mensaje = textoDe(documento, "mensaje", "Libro no encontrado.");
            mostrarMensaje(mensaje, "danger");
            document.getElementById("btnGuardar").disabled = true;
            return;
        }

        const libro = documento.querySelector("libro");
        document.getElementById("nombre").value = textoDe(libro, "nombre");
        document.getElementById("anoEdicion").value = textoDe(libro, "anoEdicion");

    } catch (error) {
        console.error(error);
        mostrarMensaje("No se ha podido conectar con el servidor.", "danger");
        document.getElementById("btnGuardar").disabled = true;
    }
}

document.getElementById("formLibro").addEventListener("submit", async function (event) {
    event.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const anoEdicion = document.getElementById("anoEdicion").value;

    if (nombre === "") {
        mostrarMensaje("El nombre no puede estar vacío.", "danger");
        return;
    }

    try {
        const parametros = new URLSearchParams();
        parametros.append("nombre", nombre);
        parametros.append("anoEdicion", anoEdicion);

        let respuesta;

        if (idLibro === null) {
            respuesta = await fetch(`${URL_LIBROS}/crear?${parametros}`, { method: "POST" });
        } else {
            parametros.append("id", idLibro);
            respuesta = await fetch(`${URL_LIBROS}/modificar?${parametros}`, { method: "PUT" });
        }

        const xml = await respuesta.text();
        const documento = new DOMParser().parseFromString(xml, "application/xml");

        if (!respuesta.ok) {
            console.error("Respuesta del servidor:", respuesta.status, xml);
            const mensaje = textoDe(documento, "mensaje", "Se ha producido un error (" + respuesta.status + ").");
            mostrarMensaje(mensaje, "danger");
            return;
        }

        const mensaje = textoDe(documento, "mensaje", "Operación realizada correctamente.");
        mostrarMensaje(mensaje, "success");
        document.getElementById("btnGuardar").disabled = true;
        setTimeout(() => { window.location.href = "libros.html"; }, 20);

    } catch (error) {
        console.error(error);
        mostrarMensaje("No se ha podido conectar con el servidor.", "danger");
    }
});

function mostrarMensaje(texto, tipo) {
    const mensaje = document.getElementById("mensaje");
    if (!mensaje) {
        alert(texto);
        return;
    }
    mensaje.textContent = texto;
    mensaje.className = `alert alert-${tipo} mt-3`;
}
	</script>

</body>
</html>
