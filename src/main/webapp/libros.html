<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de libros</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h1>Libros</h1>
				<p class="text-muted mb-0">CRUD mediante Servlets y XML</p>
			</div>
			<a href="libro.html" class="btn btn-primary"> Nuevo Libro </a>
		</div>
		<div class="card shadow-sm">
			<div class="card-body">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Año Edicion</th>
							<th class="text-end">Acciones</th>
						</tr>
					</thead>
					<tbody id="tablaLibros">
						<tr>
							<td colspan="4" class="text-center text-muted">Cargando...</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script>
const URL_LIBROS = "ej01_libros";

async function cargarLibros() {
    try {
        const respuesta = await fetch(URL_LIBROS);
        const xml = await respuesta.text();

        const documento = new DOMParser().parseFromString(xml, "application/xml");

        if (!respuesta.ok) {
            const mensaje = documento.querySelector("mensaje")?.textContent || "Error al obtener los libros.";
            mostrarFilaUnica(mensaje, "text-danger");
            return;
        }

        const libros = documento.querySelectorAll("libro");
        const tabla = document.getElementById("tablaLibros");

        tabla.innerHTML = "";

        if (libros.length === 0) {
            mostrarFilaUnica("No hay libros.", "text-muted");
            return;
        }

        libros.forEach(libro => {
            const id = libro.querySelector("id").textContent;
            const nombre = libro.querySelector("nombre").textContent;
            const anoEdicion = libro.querySelector("anoEdicion").textContent;

            const fila = document.createElement("tr");

            const celdaId = document.createElement("td");
            celdaId.textContent = id;

            const celdaNombre = document.createElement("td");
            celdaNombre.textContent = nombre;

            const celdaAnoEdicion = document.createElement("td");
            celdaAnoEdicion.textContent = anoEdicion;

            const celdaAcciones = document.createElement("td");
            celdaAcciones.className = "text-end";

            const enlace = document.createElement("a");
            enlace.href = `libro.html?id=${encodeURIComponent(id)}`;
            enlace.className = "btn btn-sm btn-outline-primary me-2";
            enlace.textContent = "Ver / editar";

            const boton = document.createElement("button");
            boton.className = "btn btn-sm btn-outline-danger";
            boton.textContent = "Eliminar";
            boton.addEventListener("click", () => eliminarLibro(id));

            celdaAcciones.appendChild(enlace);
            celdaAcciones.appendChild(boton);

            fila.appendChild(celdaId);
            fila.appendChild(celdaNombre);
            fila.appendChild(celdaAnoEdicion);
            fila.appendChild(celdaAcciones);

            tabla.appendChild(fila);
        });

    } catch (error) {
        console.error(error);
        mostrarFilaUnica("No se ha podido conectar con el servidor.", "text-danger");
    }
}

async function eliminarLibro(id) {
    if (!confirm("¿Seguro que quieres eliminar este libro?")) {
        return;
    }

    try {
        const respuesta = await fetch(`${URL_LIBROS}/eliminar?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        const xml = await respuesta.text();
        const documento = new DOMParser().parseFromString(xml, "application/xml");

        if (!respuesta.ok) {
            const mensaje = documento.querySelector("mensaje")?.textContent || "No se ha podido eliminar.";
            alert(mensaje);
            return;
        }

        const mensaje = documento.querySelector("mensaje")?.textContent || "Libro eliminado correctamente.";
        alert(mensaje);
        cargarLibros();

    } catch (error) {
        console.error(error);
        alert("No se ha podido conectar con el servidor.");
    }
}


function mostrarFilaUnica(texto, claseTexto) {
    const tabla = document.getElementById("tablaLibros");
    tabla.innerHTML = "";

    const fila = document.createElement("tr");
    const celda = document.createElement("td");
    celda.colSpan = 4;
    celda.className = "text-center " + claseTexto;
    celda.textContent = texto;

    fila.appendChild(celda);
    tabla.appendChild(fila);
}

cargarLibros();
	</script>

</body>
</html>
